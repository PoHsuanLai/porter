[package]
name = "accountd"
description = "porter's account and consent daemon: org.quire.Accounts1 over porter-service. The library serves the bus objects (Manager, Grants, Tokens, Account, Peer, the Request objects and the settings module) and the sheet link to the sheet host; the binary resolves its paths, builds the service over its seams and serves."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-fs = { workspace = true }
porter-dbus = { workspace = true, features = ["callers-file"] }
porter-discover = { workspace = true, features = ["io"] }
porter-families = { workspace = true, features = ["nextcloud", "generic", "microsoft", "google", "api_key", "openrouter", "agent_login", "tailnet"] }
porter-http = { workspace = true, features = ["hyper"] }
porter-provider = { workspace = true }
porter-proxy = { workspace = true, features = ["tls"] }
porter-secrets = { workspace = true, features = ["oo7"] }
porter-service = { workspace = true }
porter-tailscale = { workspace = true, features = ["io"] }
ds-settings = { workspace = true }
clap = { workspace = true }
oo7 = { workspace = true }
rustix = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
porter-oauth = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[features]
# Test builds only, never default and never in dist: `ACCOUNTD_PROC_ROOT=<dir>` makes the binary
# read caller identities from <dir> instead of /proc, because the jailed and acceptance tests run
# processes outside service cgroups. A release build ignores the variable. A test in
# tests/dist.rs fails if this feature is ever default, and check-boundary.sh checks it too.
test-proc-root = []
# Test builds only, never default and never in dist: `ACCOUNTD_KEYS=file:<absolute path>` keeps
# credentials in one 0600 plain-text JSON file (porter-secrets' `FileSecrets`) instead of the
# Secret Service, for private-bus and scratch runs with no keyring. A release build ignores the
# variable and says so once. tests/dist.rs and check-boundary.sh fail if this feature is default.
test-keys = ["porter-secrets/test-keys"]
