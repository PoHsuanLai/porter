[package]
name = "accountd"
description = "porter's identity daemon: org.quire.Accounts1 over porter-service, holding the identities signed in on this computer, Spaces and Tailscale. The library serves the bus objects (Manager, Account, Identities1, Spaces1, Tailnet1, the Request objects and the settings module); the binary resolves its paths, builds the service over its seams and serves."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-match = { workspace = true }
porter-capability = { workspace = true }
porter-sheet = { workspace = true }
porter-wire = { workspace = true }
porter-ids = { workspace = true }
porter-daemon = { workspace = true, features = ["watch"] }
porter-fs = { workspace = true }
porter-callers = { workspace = true, features = ["file"] }
porter-dbus = { workspace = true }
porter-families = { workspace = true, features = ["set"] }
porter-family-oauth = { workspace = true }
porter-provider = { workspace = true }
porter-secrets = { workspace = true, features = ["oo7"] }
porter-service = { workspace = true }
porter-sheets = { workspace = true }
porter-store = { workspace = true }
porter-tailscale = { workspace = true, features = ["io"] }
ds-settings = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
test-kit = { workspace = true }
ds-settings = { workspace = true, features = ["testing"] }
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
porter-http = { workspace = true }
porter-http-reqwest = { workspace = true }
porter-oauth = { workspace = true }
rustix = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[features]
# Test builds only, never default and never in dist: `ACCOUNTD_PROC_ROOT=<dir>` makes the binary
# read caller identities from <dir> instead of /proc, because the jailed and acceptance tests run
# processes outside service cgroups, and `PORTER_SYSTEM_CALLERS=<file>` makes it read that file as
# the system caller table, because a jail cannot write /etc/porter. A release build ignores both
# variables. A test in tests/dist.rs fails if this feature is ever default, and
# check-boundary.sh checks it too.
test-proc-root = ["porter-callers/test-proc-root"]
# Test builds only, never default and never in dist: `ACCOUNTD_KEYS=file:<absolute path>` keeps
# credentials in one 0600 plain-text JSON file (porter-secrets' `FileSecrets`) instead of the
# Secret Service, for private-bus and scratch runs with no keyring. A release build ignores the
# variable and says so once. tests/dist.rs and check-boundary.sh fail if this feature is default.
test-keys = ["porter-secrets/test-keys"]
