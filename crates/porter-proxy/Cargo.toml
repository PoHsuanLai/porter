[package]
name = "porter-proxy"
description = "The authenticated relay (OpenAuthenticated): per protocol a sans-io state machine (IMAP, SMTP, HTTP/1.1) and a relay over generic async I/O with a TLS connector passed in, so an app speaks its protocol and never holds the password."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
tokio = { workspace = true, optional = true, features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true }

[features]
# `TokioStream`, `ByteStream` over a tokio stream. Pulls in the runtime, so it is off by
# default: the machines and the relay reach none.
io = ["dep:tokio"]

[lints]
workspace = true
