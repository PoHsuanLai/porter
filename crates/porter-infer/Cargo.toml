[package]
name = "porter-infer"
description = "The AI broker's pure half: typed requests and replies, the local-first routing policy, spend caps, audit entries, and the Model trait wire adapters implement."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-ids = { workspace = true }
cua-action = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
test-kit = { workspace = true }
# Its own fakes, for tests/it.
porter-infer = { path = ".", features = ["testing"] }
# `llm_account` for the fake model test (tests/it/fake_model.rs).
porter-fake = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true }

[features]
# `testing`: `FakeModel` and `FakeInferSession`, for the tests of code built on the broker.
testing = []

[lints]
workspace = true
