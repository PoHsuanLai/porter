porter-http = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
test-kit = { workspace = true }
porter-fake-servers = { workspace = true }
tokio = { workspace = true }

