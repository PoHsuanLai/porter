[package]
name = "porter-family-nextcloud"
description = "The Nextcloud family: Login Flow v2, OCS discovery, WebDAV, CalDAV, CardDAV and the Notes API over one app password. A driver: nextcloud-proto builds the requests and reads the answers, dav-proto walks the principal, and this crate sends them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-family-kit = { workspace = true }
nextcloud-proto = { workspace = true }
dav-proto = { workspace = true, features = ["discover"] }
porter-core = { workspace = true }
porter-capability = { workspace = true }
porter-sheet = { workspace = true }
porter-provider = { workspace = true }
porter-http = { workspace = true }

[lints]
workspace = true
