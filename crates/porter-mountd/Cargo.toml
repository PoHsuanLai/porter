[package]
name = "porter-mountd"
description = "The one step syncd's sandbox refuses, done for it: a small user service that runs the system's setuid `fusermount3` to show a drive at ~/Cloud/<name> and hands syncd the open FUSE connection over its unix socket (SCM_RIGHTS). The library is the wire format both sides use, the client syncd calls and the server the binary runs; it owns no state and reaches no network, keyring or account data (std, rustix and listenfd only)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

