[package]
name = "porter-http"
description = "porter's HTTP seam: the `Http` trait over the `http` crate's request and response, which every family, discovery and OAuth call goes through; the clients are porter-http-reqwest (direct) and porter-http-relay (over an accountd relay)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
http = { workspace = true }
httpdate = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
# `porter_http::stream`: HTTP/1.1 over a byte stream (porter-core's `ByteStream`) and the
# `StreamHttp` client that dials one. It needs no runtime and adds no dependency, so it is pure:
# the feature reaches nothing the default build does not.
stream = []

[lints]
workspace = true
