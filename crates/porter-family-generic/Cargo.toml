[package]
name = "porter-family-generic"
description = "The generic family: a mail server or a DAV server with a password, found by autoconfig, SRV and MX, .well-known or the provider file. A driver: generic-proto holds the servers a person typed and the DAV and JMAP lookups, and this crate sends them and tries the password at the mail server."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-family-kit = { workspace = true }
generic-proto = { workspace = true }
porter-core = { workspace = true }
porter-capability = { workspace = true }
porter-sheet = { workspace = true }
porter-provider = { workspace = true }
porter-http = { workspace = true }
porter-discover = { workspace = true }
porter-proxy = { workspace = true, features = ["tls"] }
tokio = { workspace = true, features = ["rt", "time", "net", "io-util"] }

[lints]
workspace = true
