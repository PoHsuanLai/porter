[package]
name = "porter-secrets"
description = "The Secrets trait accountd files credentials through, its attribute scheme, an in-memory store for tests, and the Secret Service and platform keyring stores."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-fs = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
oo7 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[dev-dependencies]
# For the include guard of tests/it (`porter_fake::guard`) and the scratch directories of tests
# (`porter_fake::Scratch`).
porter-fake = { workspace = true }
porter-secrets = { path = ".", features = ["testing", "keyring", "test-keys"] }
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
porter-secrets = { path = ".", features = ["oo7"] }

[features]
# `MemorySecrets`, for tests and porter-fake.
testing = []
# `FileSecrets`, one 0600 JSON file of plain-text credentials, for private-bus and scratch runs.
# TEST ONLY: never default, never in a release or dist build (a daemon's `test-keys` turns it on;
# check-boundary.sh and the daemons' tests/dist.rs fail if a default build gets it). `keysel`
# (with the `oo7` feature) is how a daemon chooses between this file and the Secret Service.
test-keys = []
# `Oo7Secrets`, the Secret Service store (oo7's file backend inside a sandbox).
oo7 = ["dep:oo7", "dep:zeroize"]
# `KeyringSecrets`, the platform keyring store (Apple keychain, Windows credential manager).
keyring = ["dep:keyring-core", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store"]

[lints]
workspace = true
