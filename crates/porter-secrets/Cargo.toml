[package]
name = "porter-secrets"
description = "The Secrets trait accountd files credentials through, its attribute scheme, an in-memory store for tests, and the Secret Service store (stubbed)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
porter-secrets = { path = ".", features = ["testing"] }
tokio = { workspace = true }

[features]
# `MemorySecrets`, for tests and porter-fake.
testing = []
# `Oo7Secrets`, the Secret Service store. Its body is stubbed; the `oo7` dependency joins
# quire's `docs/workspace-deps.toml` before the store is built (FINDINGS.md).
oo7 = []

[lints]
workspace = true
