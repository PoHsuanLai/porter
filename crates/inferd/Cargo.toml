[package]
name = "inferd"
description = "porter's AI broker daemon: serves org.quire.Inference1 over porter-infer, with the router, the engine host, the model turns and the audit trail behind the session server's four seams."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# TEST ONLY, off by default and never in dist: `INFERD_PROC_ROOT=<dir>` makes the caller lookup read
# `<dir>/<pid>/cgroup` instead of `/proc`, for acceptance runs whose processes are in no unit.
# Without this feature the variable is ignored (with a line on standard error).
test-proc-root = []

[dependencies]
porter-core = { workspace = true }
cua-action = { workspace = true }
porter-dbus = { workspace = true }
porter-infer = { workspace = true }
model-provider = { workspace = true }
model-catalog = { workspace = true }
engine-supervisor = { workspace = true }
model-http = { workspace = true, features = ["hyper"] }
model-openai-compat = { workspace = true }
vision-prep = { workspace = true, features = ["pixels"] }
cua-parse = { workspace = true }
cua-session = { workspace = true }
cua-vendors = { workspace = true }
model-extract = { workspace = true }
model-replay = { workspace = true }
speech-provider = { workspace = true }
clap = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
engine-supervisor = { workspace = true, features = ["testing"] }
model-provider = { workspace = true, features = ["testing"] }
porter-client = { workspace = true, features = ["dbus"] }
porter-fake = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
