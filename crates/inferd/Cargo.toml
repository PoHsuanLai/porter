[package]
name = "inferd"
description = "porter's AI broker daemon: serves org.quire.Inference1 over porter-infer, with the router, the engine host, the model turns and the audit trail behind the session server's four seams."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# TEST ONLY, off by default and never in dist: `INFERD_PROC_ROOT=<dir>` makes the caller lookup read
# `<dir>/<pid>/cgroup` instead of `/proc`, for acceptance runs whose processes are in no unit.
# Without this feature the variable is ignored (with a line on standard error).
test-proc-root = ["porter-callers/test-proc-root"]

[dependencies]
porter-core = { workspace = true }
porter-match = { workspace = true }
porter-capability = { workspace = true }
porter-wire = { workspace = true }
porter-ids = { workspace = true }
porter-daemon = { workspace = true, features = ["watch"] }
porter-fs = { workspace = true }
cua-action = { workspace = true }
porter-callers = { workspace = true }
porter-dbus = { workspace = true }
# The AI keys are accountd's: inferd asks it through porter-client (`broker`), and removes its old
# store once accountd has copied it (`old_keys`, the record is porter-store's).
porter-client = { workspace = true }
porter-client-dbus = { workspace = true }
porter-settings = { workspace = true }
porter-store = { workspace = true }
porter-discover = { workspace = true }
porter-http = { workspace = true }
porter-http-reqwest = { workspace = true }
porter-provider = { workspace = true }
porter-tailnet = { workspace = true, features = ["io", "persist"] }
porter-tailscale = { workspace = true, features = ["io"] }
porter-infer = { workspace = true }
# Routing and the session machine: the router, the plan, the catalogue, the local model book, the
# attached engines as values, the seams.
porter-router = { workspace = true }
# Running turns: a local model's chat, embedding and computer-use turns, the structured-reply
# check, the audit trail and the stages of a pipeline.
porter-turns = { workspace = true }
porter-bridge = { workspace = true }
ds-settings = { workspace = true }
model-provider = { workspace = true }
rust_decimal = { workspace = true }
iso_currency = { workspace = true }
model-catalog = { workspace = true }
# What differs between the engines, what is installed and pinned, and where an engine is found.
engine-spec = { workspace = true }
engine-manifest = { workspace = true }
engine-probe = { workspace = true }
engine-supervisor = { workspace = true }
model-http = { workspace = true, features = ["client", "tls"] }
model-openai-compat = { workspace = true }
vision-prep = { workspace = true, features = ["pixels"] }
cua-parse = { workspace = true }
cua-session = { workspace = true }
cua-vendors = { workspace = true }
model-extract = { workspace = true }
model-replay = { workspace = true }
model-wire = { workspace = true }
speech-provider = { workspace = true }
speech-host-client = { workspace = true }
clap = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The stable short hash that names a computer written in a script with no letters or digits of
# ASCII (`computers::slug_of`); std's hasher changes between Rust versions.
sha2 = { workspace = true }
# The agent token: its bytes from the system's random source, and its compare in constant time.
getrandom = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
# `signal` is the one feature this crate adds to the pinned line: SIGTERM and SIGINT end the daemon
# gracefully (`shutdown`).
tokio = { workspace = true, features = ["signal"] }
toml = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
test-kit = { workspace = true }
ds-settings = { workspace = true, features = ["testing"] }
# The client side the tests drive inferd through.
porter-client = { workspace = true }
porter-client-dbus = { workspace = true }
inferd-client = { workspace = true, features = ["dbus"] }
# `sealed_key`: the memfd the fake Broker hands a key on.
porter-secrets = { workspace = true }
engine-supervisor = { workspace = true, features = ["testing"] }
model-provider = { workspace = true, features = ["testing"] }
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
# The scratch directory, the test catalog entries and the models they make.
porter-router = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
