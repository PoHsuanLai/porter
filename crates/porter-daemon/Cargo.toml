[package]
name = "porter-daemon"
description = "What every desktop daemon shares and has no bus for: the choice of the /proc a daemon reads its callers from, a watch on a settings file, and the XDG base directories."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["watch"]
# The settings-file watch, the one part that needs a file watcher. porter-dbus takes this crate
# without it for `root_held`, so a bus client never pulls notify in.
watch = ["dep:notify"]

[dependencies]
notify = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
test-kit = { workspace = true }

[lints]
workspace = true
