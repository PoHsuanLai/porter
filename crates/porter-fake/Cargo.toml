[package]
name = "porter-fake"
description = "Test-only: fake providers, accounts, a scripted consent prompter and a fixed clock, so client and daemon tests run without a network."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
# Only for the `infer` re-exports below.
porter-infer = { workspace = true, optional = true, features = ["testing"] }
porter-provider = { workspace = true }
porter-secrets = { workspace = true, features = ["testing"] }
porter-service = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
# `infer`: `FakeModel`, `FakeInferSession`, `Script` and `ScriptStep` at their old paths. They
# moved to `porter_infer::testing`; the re-exports are kept for one batch. Default on so a
# consumer outside porter builds as before; porter's own crates take `default-features = false`
# (the workspace entry), so porter-core's test graph builds no porter-infer.
default = ["infer"]
infer = ["dep:porter-infer"]

[lints]
workspace = true
