# A self-hosted cloud: files that poll, calendars. Signs in with an app password.
id = "fake-cloud"
label = "Fake Cloud"
mark = "generic"

[auth]
kind = "app_password"

[discovery]
kind = "fixed"

[[capability]]
family = "webdav"
endpoint = "https://cloud.invalid/remote.php/dav/"
kind = "storage"
linked_origins = ["*.cdn.cloud.invalid"]
auth_origins = ["media.cloud.invalid"]
v = { access = "read_write", delta = "poll", quota = "reported", scope = "full", hashes = "sha1", ranges = "present", chunked_upload = "absent" }

[[capability]]
family = "caldav"
kind = "calendar"
v = { access = "read_write", delta = "poll", transport = "caldav", collections = "present" }
