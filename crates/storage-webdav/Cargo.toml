[package]
name = "storage-webdav"
description = "The WebDAV replica: porter-sync's Replica over dav-proto and the HTTP seam. Changes by sync-collection (RFC 6578) with an etag tree walk where the server has none, writes guarded by If-Match and If-None-Match, quota from RFC 4331, and an HTTP/1.1 client over one authenticated byte stream (accountd's OpenAuthenticated). Pure: no runtime, no socket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dav-proto = { workspace = true, features = ["http"] }
porter-capability = { workspace = true }
porter-ids = { workspace = true }
porter-http = { workspace = true }
porter-sync = { workspace = true }

[dev-dependencies]
test-kit = { workspace = true }
base64 = { workspace = true }
porter-fake-servers = { workspace = true }
porter-http-relay = { workspace = true }
porter-sync = { workspace = true, features = ["testing"] }
roxmltree = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
