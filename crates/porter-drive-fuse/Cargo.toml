[package]
name = "porter-drive-fuse"
description = "A drive of porter-drive at a real path: fuser's calls (lookup, getattr, readdir, open, read, release, statfs, and create, mkdir, write, setattr, rename, unlink, rmdir, fsync) mapped onto the core, read-write over a drive that takes changes, mounted through the system's fusermount3 run as a separate process (fuser with no default features: no libfuse is linked). Stale mounts are cleaned before mounting; a computer with no /dev/fuse or fusermount3 is told apart."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-drive = { workspace = true }
# The helper syncd asks to mount when its sandbox may not (its client and wire format).
porter-mountd = { workspace = true }
# No default features: the pure-Rust mount, through `fusermount3` as a separate process, and no
# libfuse linked (no GPL or LGPL linking).
fuser = { version = "0.18", default-features = false }
rustix = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
test-kit = { workspace = true }
porter-drive = { workspace = true, features = ["testing"] }
tokio = { workspace = true }

[lints]
workspace = true
