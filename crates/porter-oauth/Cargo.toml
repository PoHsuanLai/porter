[package]
name = "porter-oauth"
description = "OAuth for porter's families: PKCE, the loopback redirect rules, the client registry, renewal, and the token, refresh and revoke exchanges over the `Http` seam; the loopback listener is behind the `io` feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-http = { workspace = true }
porter-provider = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, optional = true, features = ["net", "time", "io-util"] }

[dev-dependencies]
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "io-util"] }

[features]
# `LoopbackServer`, the 127.0.0.1 listener. Pulls in the runtime, so it is off by default: the
# rules, the registry and the exchanges reach none.
io = ["dep:tokio"]

[lints]
workspace = true

[[test]]
name = "fake_issuer"
required-features = ["io"]
