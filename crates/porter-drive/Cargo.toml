[package]
name = "porter-drive"
description = "Files on demand over a drive's listing, without a file system: the names a drive's items are shown by, the link files of online documents, the content cache (chunked fetches a read waits on, Keep Downloaded, Remove Download, eviction past a limit) and each item's state. The FUSE adapter (porter-drive-fuse) and syncd's Storage1 are built over it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-capability = { workspace = true }
porter-ids = { workspace = true }
porter-fs = { workspace = true }
porter-sync = { workspace = true }
quickxorhash = { workspace = true }
md-5 = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rangemap = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
test-kit = { workspace = true }
porter-drive = { path = ".", features = ["testing"] }
tokio = { workspace = true }

[features]
# `MemoryListing` and `MemorySource`: a drive held in memory, for the tests of this crate, the
# FUSE adapter's and syncd's.
testing = []

[lints]
workspace = true
