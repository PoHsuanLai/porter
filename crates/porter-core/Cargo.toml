[package]
name = "porter-core"
description = "porter's pure vocabulary: accounts, the capability vocabulary and matching, consent, secrets' keys, the wire protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# Published: mailo's libraries name these types from crates.io. The rest of porter is not.
publish = true
homepage = "https://github.com/PoHsuanLai/porter"
readme = "README.md"
keywords = ["accounts", "consent", "oauth", "credentials", "desktop"]
categories = ["authentication", "data-structures"]

[dependencies]
peephole-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Only for the include guard of tests/it (`porter_fake::guard`).
porter-fake = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
