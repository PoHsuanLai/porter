[package]
name = "porter-sync"
description = "The sync engine contract: the Replica trait, anchors, base versions, conflicts and tombstones as values, dataset kinds, and an in-memory reference replica."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Only for the include guard of tests/it (`porter_fake::guard`).
porter-fake = { workspace = true }
porter-sync = { path = ".", features = ["testing"] }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
# `MemoryReplica`, the reference replica the contract tests drive.
testing = []

[lints]
workspace = true
