[package]
name = "porter-callers"
description = "Who is calling a daemon: a bus connection's sender to an app and a role (peephole's judgement of the process, then the caller table), the table read from its files, and which /proc and which system tables a daemon reads them from."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
peephole = { workspace = true }
peephole-core = { workspace = true, features = ["toml"] }
peephole-bus = { workspace = true }
zbus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The table's reader, behind the feature that only the daemons turn on.
toml = { workspace = true, optional = true }

[features]
# The caller table read from `callers.toml` files (`load_callers`): accountd's and syncd's.
file = ["dep:toml"]
# TEST ONLY, never default and never in dist: `ProcCallers::with_proc_root` and `caller_of_pid` read a
# directory tree standing for /proc (peephole's `fake` seams: a process that is only a claim). A daemon
# turns it on through its own `test-proc-root` feature; check-boundary.sh checks that no default build
# has it.
test-proc-root = ["peephole/fake"]

[dev-dependencies]
test-kit = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
