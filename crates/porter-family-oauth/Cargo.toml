[package]
name = "porter-family-oauth"
description = "OAuth: PKCE through a loopback redirect, one provider, sign-in and session for every issuer, with the rules of Google and Microsoft beside them. A driver: oauth-probe-proto reads what a token shows, porter-oauth does the exchanges, and this crate sends the reads."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-family-kit = { workspace = true }
oauth-probe-proto = { workspace = true }
porter-core = { workspace = true }
porter-capability = { workspace = true }
porter-sheet = { workspace = true }
porter-ids = { workspace = true }
porter-provider = { workspace = true }
porter-http = { workspace = true }
porter-http-reqwest = { workspace = true }
porter-oauth = { workspace = true, features = ["io"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "net", "io-util"] }

[dev-dependencies]
test-kit = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
