[package]
name = "porter-families"
description = "The protocol families as code, one feature each: DynProvider is porter-provider's Provider as a trait object, over the built families, for accountd and for an app hosting porter in process."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-capability = { workspace = true }
porter-sheet = { workspace = true }
porter-ids = { workspace = true }
porter-provider = { workspace = true }
porter-http = { workspace = true }
porter-http-reqwest = { workspace = true, optional = true }
porter-proxy = { workspace = true, optional = true }
dav-proto = { workspace = true, optional = true }
porter-dav = { workspace = true, optional = true }
porter-discover = { workspace = true, optional = true }
porter-oauth = { workspace = true, optional = true }
porter-tailscale = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time", "net", "io-util"] }
base64 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
test-kit = { workspace = true }
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "io-util"] }
porter-http-reqwest = { workspace = true }
porter-secrets = { workspace = true, features = ["testing"] }
porter-service = { workspace = true }
porter-wire = { workspace = true }
porter-match = { workspace = true }

[features]
# `set`: which provider files a daemon serves and the family of each (`set::load_specs`,
# `family_of`, `served`, `FamilyIo`), over every family it maps: nextcloud, generic, oauth,
# api_key, agent_login and tailnet, with the system resolver.
set = ["nextcloud", "generic", "oauth", "api_key", "agent_login", "tailnet", "dep:thiserror", "porter-discover/io", "dep:porter-http-reqwest"]
# Nextcloud: Login Flow v2, OCS discovery, WebDAV, CalDAV, CardDAV, Notes.
nextcloud = ["dep:dav-proto", "dep:porter-dav", "dep:porter-discover", "dep:base64", "dep:serde_json"]
# Generic IMAP/SMTP and DAV with a password or app password, found by autoconfig.
# The password is tried at the incoming mail server before the account is added (the relay's own login).
generic = ["dep:dav-proto", "dep:porter-dav", "dep:porter-discover", "dep:base64", "dep:porter-proxy", "porter-proxy/tls", "dep:tokio"]
# OAuth: PKCE through a loopback redirect, one family for every issuer (the rules of Google and
# Microsoft, and any issuer whose data in porter-provider's `issuers.toml` says who answered).
# Google: Calendar, People, Tasks, the Drive app folder, Photos, and Gmail IMAP/SMTP XOAUTH2 for a
# client of the person's own. Microsoft: IMAP/SMTP XOAUTH2 and Graph.
oauth = ["dep:porter-oauth", "porter-oauth/io", "dep:porter-http-reqwest", "dep:serde", "dep:serde_json", "dep:tokio"]
# AI providers with a pasted API key (Anthropic, OpenAI).
api_key = ["dep:porter-http-reqwest"]
# Coding agents that sign themselves in (Claude Code, Gemini CLI, Codex): no credential held.
agent_login = []
# Tailscale on this computer: asked over its unix socket, no credential held.
tailnet = ["dep:porter-tailscale", "porter-tailscale/io"]

[lints]
workspace = true
