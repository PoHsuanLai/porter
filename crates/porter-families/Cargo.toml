[package]
name = "porter-families"
description = "The protocol families as code, one feature each: FamilyProvider dispatches porter-provider's Provider over the built families, for accountd and for an app hosting porter in process."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-provider = { workspace = true }
porter-http = { workspace = true }
porter-dav = { workspace = true, optional = true }
porter-discover = { workspace = true, optional = true }
porter-oauth = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time", "net", "io-util"] }
base64 = { workspace = true, optional = true }

[dev-dependencies]
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "io-util"] }
porter-http = { workspace = true, features = ["hyper"] }
porter-secrets = { workspace = true, features = ["testing"] }
porter-service = { workspace = true }

[features]
# Nextcloud: Login Flow v2, OCS discovery, WebDAV, CalDAV, CardDAV, Notes.
nextcloud = ["dep:porter-dav", "dep:porter-discover", "dep:base64", "dep:serde_json"]
# Generic IMAP/SMTP and DAV with a password or app password, found by autoconfig.
generic = ["dep:porter-dav", "dep:porter-discover", "dep:base64"]
# Microsoft: OAuth PKCE and device code, IMAP/SMTP XOAUTH2, Graph.
microsoft = ["dep:porter-oauth", "dep:porter-discover", "porter-oauth/io", "porter-http/hyper", "dep:serde", "dep:serde_json", "dep:tokio"]
# Google: OAuth PKCE through a loopback redirect with the owner's own client, Calendar, People,
# Tasks, the Drive app folder, Photos, and Gmail IMAP/SMTP XOAUTH2 for a client of one's own.
google = ["dep:porter-oauth", "porter-oauth/io", "porter-http/hyper", "dep:serde", "dep:serde_json", "dep:tokio"]
# AI providers with a pasted API key (Anthropic, OpenAI).
api_key = ["porter-http/hyper"]
# Coding agents that sign themselves in (Claude Code, Gemini CLI, Codex): no credential held.
agent_login = []
# OpenRouter: OAuth PKCE that mints a key.
openrouter = ["dep:porter-oauth"]

[lints]
workspace = true
