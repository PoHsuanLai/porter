[package]
name = "porter-families"
description = "The registry of the protocol families: DynProvider is porter-provider's Provider as a trait object, the family that serves each provider file, and the small families (an API key, a coding agent that signs itself in, Tailscale). The families with a protocol of their own are porter-family-oauth, -generic and -nextcloud."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-family-kit = { workspace = true }
porter-family-nextcloud = { workspace = true, optional = true }
porter-family-generic = { workspace = true, optional = true }
porter-family-oauth = { workspace = true, optional = true }
porter-core = { workspace = true }
porter-capability = { workspace = true }
porter-sheet = { workspace = true }
porter-ids = { workspace = true }
porter-provider = { workspace = true }
porter-http = { workspace = true }
porter-http-reqwest = { workspace = true, optional = true }
porter-discover = { workspace = true, optional = true }
porter-tailscale = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
test-kit = { workspace = true }
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "io-util"] }
porter-http-reqwest = { workspace = true }
porter-secrets = { workspace = true, features = ["testing"] }
porter-service = { workspace = true }
porter-wire = { workspace = true }
porter-match = { workspace = true }
porter-discover = { workspace = true }
porter-oauth = { workspace = true, features = ["io"] }
porter-proxy = { workspace = true, features = ["tls"] }
dav-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

[features]
# `set`: which provider files a daemon serves and the family of each (`set::load_specs`,
# `family_of`, `served`, `FamilyIo`), over every family it maps: nextcloud, generic, oauth,
# api_key, agent_login and tailnet, with the system resolver.
set = ["nextcloud", "generic", "oauth", "api_key", "agent_login", "tailnet", "dep:thiserror", "dep:porter-discover", "porter-discover/io", "dep:porter-http-reqwest"]
# Nextcloud (porter-family-nextcloud): Login Flow v2, OCS discovery, WebDAV, CalDAV, CardDAV, Notes.
nextcloud = ["dep:porter-family-nextcloud"]
# Generic IMAP/SMTP and DAV with a password or app password, found by autoconfig
# (porter-family-generic). The password is tried at the incoming mail server before the account is
# added (the relay's own login).
generic = ["dep:porter-family-generic"]
# OAuth (porter-family-oauth): PKCE through a loopback redirect, one family for every issuer (the
# rules of Google and Microsoft, and any issuer whose data in porter-provider's `issuers.toml`
# says who answered). Google: Calendar, People, Tasks, the Drive app folder, Photos, and Gmail
# IMAP/SMTP XOAUTH2 for a client of the person's own. Microsoft: IMAP/SMTP XOAUTH2 and Graph.
oauth = ["dep:porter-family-oauth"]
# AI providers with a pasted API key (Anthropic, OpenAI).
api_key = ["dep:porter-http-reqwest"]
# Coding agents that sign themselves in (Claude Code, Gemini CLI, Codex): no credential held.
agent_login = []
# Tailscale on this computer: asked over its unix socket, no credential held.
tailnet = ["dep:porter-tailscale", "porter-tailscale/io"]

[lints]
workspace = true
