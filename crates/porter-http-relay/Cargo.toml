[package]
name = "porter-http-relay"
description = "porter's HTTP client over an accountd relay: hyper's HTTP/1 connection over the authenticated byte stream accountd opens, with streamed request and response bodies, connection reuse and a new connection when a kept one's credential lapsed."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-http = { workspace = true }
porter-client = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "io-util", "rt"] }

[dev-dependencies]
porter-fake = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
