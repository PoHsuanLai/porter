[package]
name = "porter-client"
description = "The app-facing API: find an account by capability, ask for consent, get tokens and inference, over D-Bus or in process."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-infer = { workspace = true, optional = true }
porter-bridge = { workspace = true, optional = true }
# `engines`: the turn the daemon runs (`run_chat`) and the clock its retries wait on.
porter-turns = { workspace = true, optional = true }
model-http = { workspace = true, optional = true, features = ["hyper", "tls"] }
model-openai-compat = { workspace = true, optional = true }
model-provider = { workspace = true, optional = true }
model-wire = { workspace = true, optional = true }
porter-provider = { workspace = true, optional = true }
porter-secrets = { workspace = true, optional = true }
porter-service = { workspace = true, optional = true }
porter-dbus = { workspace = true, optional = true }
porter-fs = { workspace = true, optional = true }
# `relays`: `PorterRelays`, the relay host that runs `porter_proxy::relay` over rustls.
porter-proxy = { workspace = true, optional = true, features = ["io", "tls"] }
rustix = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
test-kit = { workspace = true }
# The tests name the service, the secrets and the provider catalogue whether or not `in-process`
# is on; the feature gates only the crate's own `InProcess` and its dependencies.
porter-provider = { workspace = true }
porter-secrets = { workspace = true }
porter-service = { workspace = true }
ds-settings = { workspace = true }
cua-action = { workspace = true }
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
# The scripted inference session the session tests play (`porter_infer::testing`).
porter-infer = { workspace = true, features = ["testing"] }
porter-families = { workspace = true, features = ["generic"] }
porter-http = { workspace = true }
porter-http-reqwest = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }

# The daemons the bus tests start (Linux only, as the transport is). They bring
# peephole (who is calling, through pidfds) and the Secret Service store, which build only there;
# the portable build (macOS, Windows) tests the pure and in-process paths without them.
[target.'cfg(target_os = "linux")'.dev-dependencies]
accountd = { path = "../accountd" }
inferd = { path = "../inferd" }
# tailscaled's LocalAPI client, over its Unix socket, for the tailnet bus test.
porter-tailscale = { workspace = true, features = ["io"] }

[features]
# No feature is on by default: a consumer names the ones it uses.
default = []
# Inference: sessions with inferd, `Need::Llm` paths, `prepare`. An accounts-only consumer leaves
# it off and builds no porter-infer, so no stoker.
infer = ["dep:porter-infer"]
# `InProcess`: the app hosts the account service itself (porter-service, its secrets and the
# provider catalogue). A consumer that only talks to accountd over a bus leaves it off and builds
# none of them: `cargo tree -p porter-client --features dbus` reaches none
# (scripts/check-boundary.sh).
in-process = ["dep:porter-provider", "dep:porter-secrets", "dep:porter-service"]
# Inference with no inferd: `EngineHost`, a `SessionHost` that routes need -> engine over a table
# the app gives and drives the OpenAI-compatible engines it points at (Ollama, llama.cpp, LM
# Studio, vLLM, a company's API), with keys from a `KeySource` the app implements. Off by
# default: it brings stoker's HTTP client with TLS (hyper, rustls) and a runtime, which neither
# an accounts-only app nor one that talks to inferd needs.
engines = [
  "infer", "dep:tokio", "dep:serde_json", "dep:porter-bridge", "dep:porter-turns", "dep:model-http",
  "dep:model-openai-compat", "dep:model-provider", "dep:model-wire",
]
# `TailnetLending`: installs and takes away the drop-in that lets the person's other computers
# reach inferd (the Settings switch "Let my other computers use this computer's models"), with the
# manager of the person's units injected. Off by default: it brings porter-fs (std only). With
# `dbus` it also has `SessionUnits`, the real manager over the session bus.
lending = ["dep:porter-fs"]
# `PorterRelays`: a `RelayHost` that runs the authenticated relays of an app or daemon hosting its
# own `AccountService` (`InProcess::with_relays`), on its tokio runtime, over rustls. Off by
# default: it brings porter-proxy with TLS and a runtime.
relays = ["dep:porter-proxy", "dep:tokio"]
# The D-Bus transport (Linux, the desktop's accountd and inferd). It reads the session `Open`
# returns as frames over a Unix stream socket with descriptors riding on them, so it pulls in the
# runtime: the pure build reaches none.
dbus = ["dep:rustix", "dep:serde", "dep:tokio", "dep:porter-dbus", "dep:serde_json", "dep:zbus"]

[lints]
workspace = true

# Lists the guests and answers one, for Settings and the shell to copy.
[[example]]
name = "guests"
required-features = ["dbus"]

# Shows, installs and takes away the tailnet drop-in, for Settings' switch to copy.
[[example]]
name = "lending"
required-features = ["lending", "dbus"]
