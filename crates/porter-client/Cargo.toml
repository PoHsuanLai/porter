[package]
name = "porter-client"
description = "The app-facing API: find an account by capability, ask for consent, get tokens and inference, over D-Bus, the latchkey socket, or in process."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-infer = { workspace = true, optional = true }
porter-bridge = { workspace = true, optional = true }
model-http = { workspace = true, optional = true, features = ["hyper", "tls"] }
model-openai-compat = { workspace = true, optional = true }
model-provider = { workspace = true, optional = true }
model-wire = { workspace = true, optional = true }
porter-provider = { workspace = true, optional = true }
porter-secrets = { workspace = true, optional = true }
porter-service = { workspace = true, optional = true }
porter-dbus = { workspace = true, optional = true }
latchkey = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
# The tests name the service, the secrets and the provider catalogue whether or not `in-process`
# is on; the feature gates only the crate's own `InProcess` and its dependencies.
porter-provider = { workspace = true }
porter-secrets = { workspace = true }
porter-service = { workspace = true }
ds-settings = { workspace = true }
latchkey = { workspace = true }
accountd = { path = "../accountd" }
cua-action = { workspace = true }
inferd = { path = "../inferd" }
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
porter-families = { workspace = true, features = ["generic"] }
porter-http = { workspace = true, features = ["hyper"] }
porter-tailscale = { workspace = true, features = ["io"] }
tokio = { workspace = true }
zbus = { workspace = true }

[features]
# Inference: sessions with inferd, `Need::Llm` paths, `prepare`. Default on so every existing
# consumer builds as before; an accounts-only consumer says `default-features = false` (plus
# `socket` or `dbus`) and builds no porter-infer, so no stoker.
default = ["infer", "in-process"]
infer = ["dep:porter-infer"]
# `InProcess`: the app hosts the account service itself (porter-service, its secrets and the
# provider catalogue). On by default so every existing consumer builds as before; a consumer
# that only talks to accountd over a bus says `default-features = false` and builds none of
# them: `cargo tree -p porter-client --no-default-features --features dbus` reaches none
# (scripts/check-boundary.sh).
in-process = ["dep:porter-provider", "dep:porter-secrets", "dep:porter-service"]
# Inference with no inferd: `EngineHost`, a `SessionHost` that routes need -> engine over a table
# the app gives and drives the OpenAI-compatible engines it points at (Ollama, llama.cpp, LM
# Studio, vLLM, a company's API), with keys from a `KeySource` the app implements. Off by
# default: it brings stoker's HTTP client with TLS (hyper, rustls) and a runtime, which neither
# an accounts-only app nor one that talks to inferd needs.
engines = [
  "infer", "dep:tokio", "dep:serde_json", "dep:porter-bridge", "dep:model-http",
  "dep:model-openai-compat", "dep:model-provider", "dep:model-wire",
]
# Frames over a Unix stream socket with descriptors riding on them (what both carriers below
# share). Pulls in the runtime, so it is off by default: the pure build reaches none.
framed = ["dep:rustix", "dep:serde", "dep:tokio"]
# The D-Bus transport (Linux, the desktop's accountd and inferd).
dbus = ["framed", "dep:porter-dbus", "dep:serde_json", "dep:zbus"]
# The latchkey socket carrier (other desktops, macOS; a named pipe on Windows is not built):
# the agent's address, lock and start come from latchkey. Without it `SocketTransport` finds
# nobody.
socket = ["framed", "dep:latchkey"]

[lints]
workspace = true

# Each is its own test executable: it starts that executable again as a fake child, by test name.
[[test]]
name = "connect"

[[test]]
name = "socket_accounts"
