[package]
name = "porter-discover"
description = "Discovery for porter's families: autoconfig, SRV and MX leads, well-known URLs, Nextcloud OCS capabilities and port probes, as pure parsers plus the DNS and HTTP seams."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-http = { workspace = true }
porter-provider = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hickory-resolver = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
toml = { workspace = true }

[features]
# `HickoryDns`, the `Dns` seam over the system resolver. Pulls in the runtime, so it is off by
# default: the parsers and the search reach none.
io = ["dep:hickory-resolver"]

[lints]
workspace = true
