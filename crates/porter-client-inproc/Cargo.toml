[package]
name = "porter-client-inproc"
description = "The hosted transport of porter-client: an app that runs the account service itself, with its own providers, secrets and sheet host."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-client = { workspace = true }
porter-core = { workspace = true }
porter-ids = { workspace = true }
porter-match = { workspace = true }
porter-provider = { workspace = true }
porter-secrets = { workspace = true }
porter-service = { workspace = true }
porter-service-accounts = { workspace = true }
porter-service-core = { workspace = true }
porter-service-grants = { workspace = true }
porter-sheet = { workspace = true }
porter-wire = { workspace = true }
# `relays`: `PorterRelays`, the relay host that runs `porter_proxy::relay` over rustls.
porter-proxy = { workspace = true, optional = true, features = ["io", "tls"] }
tokio = { workspace = true, optional = true }

[dev-dependencies]
test-kit = { workspace = true }
porter-capability = { workspace = true }
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
porter-families = { workspace = true }
porter-family-generic = { workspace = true }
porter-http = { workspace = true }
porter-http-reqwest = { workspace = true }
tokio = { workspace = true }

[features]
# No feature is on by default: a consumer names the ones it uses.
default = []
# `PorterRelays`: a `RelayHost` that runs the authenticated relays of an app or daemon hosting its
# own `AccountService`, on its tokio runtime, over rustls. Off by default: it brings porter-proxy
# with TLS and a runtime.
relays = ["dep:porter-proxy", "dep:tokio"]

[lints]
workspace = true
