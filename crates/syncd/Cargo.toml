[package]
name = "syncd"
description = "porter's sync daemon: org.quire.Sync1 over porter-sync replicas. The library holds the SQLite journal, the engine over a Replica and a Dataset, the pure scheduler, the bus objects and syncd's own accounts (its own store, \"Continue as\" sign-in and Settings rows); the binary resolves its paths and serves. Datasets: the calendar, contacts and tasks mirror (CalDAV, CardDAV, Microsoft Graph and Google), the storage folder (WebDAV, OneDrive and Google Drive app folders), the whole drives shown in Files, and Photos for an account whose Photos row is on."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-match = { workspace = true }
porter-capability = { workspace = true }
porter-sheet = { workspace = true }
porter-wire = { workspace = true }
porter-ids = { workspace = true }
porter-daemon = { workspace = true }
porter-fs = { workspace = true }
porter-client = { workspace = true }
porter-client-dbus = { workspace = true }
porter-client-inproc = { workspace = true, features = ["relays"] }
dav-proto = { workspace = true, features = ["discover"] }
porter-callers = { workspace = true, features = ["file"] }
porter-dbus = { workspace = true }
porter-drive = { workspace = true }
porter-drive-fuse = { workspace = true }
porter-families = { workspace = true, features = ["set"] }
porter-family-oauth = { workspace = true }
porter-http = { workspace = true }
porter-http-relay = { workspace = true }
porter-provider = { workspace = true }
porter-secrets = { workspace = true, features = ["oo7"] }
porter-service = { workspace = true }
porter-service-core = { workspace = true }
porter-service-accounts = { workspace = true }
porter-sheets = { workspace = true }
porter-store = { workspace = true }
porter-sync = { workspace = true }
storage-gdrive = { workspace = true }
storage-graph = { workspace = true }
storage-webdav = { workspace = true }
ds-settings = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
mime_guess = { workspace = true }
nanohtml2text = { workspace = true }
windows-zones = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# `signal`: SIGTERM unmounts the drives before the process ends.
tokio = { workspace = true, features = ["signal"] }
toml = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
test-kit = { workspace = true }
ds-settings = { workspace = true, features = ["testing"] }
syncd = { path = ".", features = ["testing"] }
base64 = { workspace = true }
tempfile = { workspace = true }
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
porter-http-reqwest = { workspace = true }
porter-drive = { workspace = true, features = ["testing"] }
porter-secrets = { workspace = true, features = ["testing"] }
porter-sync = { workspace = true, features = ["testing"] }
# The words the fake of Storage1 gives are held to the live ones (tests/it/fake_words.rs).
syncd-fakes = { workspace = true }
# A paused clock for the stop wait's timing test.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[features]
# Test builds only, never default and never in dist: `SYNCD_PROC_ROOT=<dir>` makes the binary
# read caller identities from <dir> instead of /proc, because the jailed and acceptance tests run
# processes outside service cgroups, and `PORTER_SYSTEM_CALLERS=<file>` makes it read that file as
# the system caller table, because a jail cannot write /etc/porter. A release build ignores both
# variables. A test in tests/dist.rs fails if this feature is ever default, and
# check-boundary.sh checks it too.
test-proc-root = ["porter-callers/test-proc-root"]
# Test builds only, never default and never in dist: `SYNCD_KEYS=file:<absolute path>` keeps
# syncd's own credentials in one 0600 plain-text JSON file (porter-secrets' `FileSecrets`)
# instead of the Secret Service, for private-bus and scratch runs with no keyring. A release
# build ignores the variable and says so once. tests/dist.rs and check-boundary.sh fail if this
# feature is default.
test-keys = ["porter-secrets/test-keys"]
# `MemoryDataset`, the in-memory local side the engine's tests (and daemon tests) drive.
testing = []
# Serves `org.quire.Photos1.Picker` beside Sync1 (porter-dbus's feature of the same name declares
# it). Off by default: no Photos app ships in v1.
photos-picker = ["porter-dbus/photos-picker"]
