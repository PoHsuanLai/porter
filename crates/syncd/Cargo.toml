[package]
name = "syncd"
description = "porter's sync daemon: org.quire.Sync1 over porter-sync replicas. The library holds the SQLite journal, the engine over a Replica and a Dataset, the pure scheduler and the bus objects; the binary resolves its paths and serves. Datasets: the calendar, contacts and tasks mirror (CalDAV, CardDAV, Microsoft Graph and Google), the storage folder (WebDAV, OneDrive and Google Drive app folders) and, behind SYNCD_PHOTOS=on, Photos."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
porter-dav = { workspace = true }
porter-dbus = { workspace = true, features = ["callers-file"] }
porter-http = { workspace = true }
porter-sync = { workspace = true }
storage-gdrive = { workspace = true }
storage-graph = { workspace = true }
storage-webdav = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
syncd = { path = ".", features = ["testing"] }
accountd = { path = "../accountd" }
base64 = { workspace = true }
ds-settings = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
porter-fake = { workspace = true }
porter-fake-servers = { workspace = true }
porter-provider = { workspace = true }
porter-secrets = { workspace = true }
porter-service = { workspace = true }
porter-sync = { workspace = true, features = ["testing"] }
tokio = { workspace = true }

[lints]
workspace = true

[features]
# Test builds only, never default and never in dist: `SYNCD_PROC_ROOT=<dir>` makes the binary
# read caller identities from <dir> instead of /proc, because the jailed and acceptance tests run
# processes outside service cgroups. A release build ignores the variable. A test in
# tests/dist.rs fails if this feature is ever default, and check-boundary.sh checks it too.
test-proc-root = []
# `MemoryDataset`, the in-memory local side the engine's tests (and daemon tests) drive.
testing = []
