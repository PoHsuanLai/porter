[package]
name = "porter-dbus"
description = "porter's D-Bus API: accountd's interfaces (org.quire.Accounts1, Identities1, Spaces1, Tailnet1 and the AI keys'), each written once, as the zbus proxy its callers use, the trait a daemon implements and the object that serves it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-tailscale = { workspace = true }
porter-wire = { workspace = true }
porter-dbus-macros = { workspace = true }
porter-ids = { workspace = true }
zbus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `serve_ready`'s deadline; zbus already runs on tokio here.
tokio = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
test-kit = { workspace = true }
proptest = { workspace = true }
# A paused clock for `serve_ready`'s timing tests.
tokio = { workspace = true, features = ["test-util"] }
porter-capability = { workspace = true }
