[package]
name = "porter-dbus"
description = "porter's D-Bus API: org.quire.Accounts1, org.quire.Sync1 and org.quire.Inference1 each written once, as the zbus proxy its callers use, the trait a daemon implements and the object that serves it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
porter-tailscale = { workspace = true }
porter-match = { workspace = true }
porter-wire = { workspace = true }
porter-dbus-macros = { workspace = true }
porter-ids = { workspace = true }
zbus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `serve_ready`'s deadline; zbus already runs on tokio here.
tokio = { workspace = true }

[features]
# The Photos Picker's proxy and interface (`org.quire.Photos1.Picker`). Off by default: no Photos
# app ships in v1, so the default bus surface does not declare it. syncd's feature of the same
# name turns it on for the object it serves.
photos-picker = []

[lints]
workspace = true

[dev-dependencies]
test-kit = { workspace = true }
proptest = { workspace = true }
# A paused clock for `serve_ready`'s timing tests.
tokio = { workspace = true, features = ["test-util"] }
porter-capability = { workspace = true }
