[package]
name = "porter-dbus"
description = "porter's D-Bus API: org.quire.Accounts1, org.quire.Sync1 and org.quire.Inference1 as zbus proxies and interface skeletons, and their introspection."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
porter-core = { workspace = true }
zbus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `serve_ready`'s deadline; zbus already runs on tokio here.
tokio = { workspace = true }
# `callers_file`'s reader, behind the feature that only the daemons turn on.
toml = { workspace = true, optional = true }

[features]
# The caller table read from `callers.toml` files (`load_callers`): accountd's and syncd's.
callers-file = ["dep:toml"]
# The Photos Picker's proxy and interface (`org.quire.Photos1.Picker`). Off by default: no Photos
# app ships in v1, so the default bus surface does not declare it. syncd's feature of the same
# name turns it on for the object it serves.
photos-picker = []

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
# A paused clock for `serve_ready`'s timing tests.
tokio = { workspace = true, features = ["test-util"] }
