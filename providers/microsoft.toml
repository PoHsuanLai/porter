# Microsoft, personal and work or school accounts, through one multi-tenant client (design/31
# §3.2). Mail is IMAP and SMTP with XOAUTH2 (the sign-in's `outlook.office.com` scopes); the rest
# is Graph. A tenant that forbids a Graph service answers its probe with 403, and the account
# shows that kind as absent for tenant consent (R13). OneNote has no delta (C11).
id = "microsoft"
label = "Microsoft"
mark = "microsoft"
group = "internet"

[auth]
kind = "oauth_pkce"
issuer = "microsoft"

[discovery]
kind = "fixed"

[matching]
domains = ["outlook.com", "hotmail.com", "live.com", "msn.com", "onmicrosoft.com"]
domain_suffixes = ["onmicrosoft.com"]
mx_suffixes = ["mail.protection.outlook.com", "outlook.com"]

[[capability]]
family = "imap"
endpoint = "imaps://outlook.office365.com:993"
kind = "mail"
access = "read_write"
send = "present"
delta = "push"
transport = "imap"
labels = "folders"

[[capability]]
family = "graph"
endpoint = "https://graph.microsoft.com"
kind = "calendar"
access = "read_write"
delta = "poll"
transport = "graph"
collections = "present"

[[capability]]
family = "graph"
endpoint = "https://graph.microsoft.com"
kind = "contacts"
access = "read_write"
delta = "poll"
transport = "graph"
collections = "present"

[[capability]]
family = "graph"
endpoint = "https://graph.microsoft.com"
kind = "tasks"
access = "read_write"
delta = "poll"
transport = "graph"
collections = "present"

[[capability]]
family = "graph"
endpoint = "https://graph.microsoft.com"
kind = "notes"
access = "read_write"
delta = "none"
transport = "one_note"

[[capability]]
family = "graph"
endpoint = "https://graph.microsoft.com"
kind = "storage"
# Graph answers an upload session with an `uploadUrl` and a content request with a redirect to a
# `downloadUrl`; both are pre-authenticated and on these hosts (Microsoft Graph docs, "Upload
# large files with an upload session" and "driveItem: download": personal OneDrive
# `https://<n>.up.1drv.com/up/<token>` and `https://<n>.files.1drv.com/...`, OneDrive for Business
# and SharePoint `https://<tenant>[-my].sharepoint.com/...`). `*.sharepoint.com` is every tenant's.
linked_origins = ["*.up.1drv.com", "*.files.1drv.com", "*.sharepoint.com"]
access = "read_write"
delta = "poll"
quota = "reported"
scope = "app_folder"
hashes = "quick_xor"
ranges = "present"
chunked_upload = "present"

# The whole OneDrive (`Files.ReadWrite`), asked only when the person turns on "Show in Files" for
# the account, in a sign-in that asks for it alone; the app folder above is what sign-in asks.
[[capability]]
family = "graph"
endpoint = "https://graph.microsoft.com"
kind = "storage"
ask = "on_use"
linked_origins = ["*.up.1drv.com", "*.files.1drv.com", "*.sharepoint.com"]
access = "read_write"
delta = "poll"
quota = "reported"
scope = "full"
hashes = "quick_xor"
ranges = "present"
chunked_upload = "present"
