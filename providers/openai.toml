# OpenAI, checked with GET /v1/models, header Authorization: Bearer.
# The account is an API key the person pastes, like an email password: no sign-in with the company.
# `discover` checks the key with one call to the models list and keeps none of the answer. The
# row below is the floor every chat model meets; the models themselves are the curated catalogue
# (stoker), grouped by company, and accountd keeps no list. Its billing is
# metered: what a reply cost is what the provider reports, and no price is kept here.
id = "openai"
label = "OpenAI"
mark = "openai"
group = "intelligence"

[mark_face]
letter = "O"
colour = "#10A37F"

[auth]
kind = "api_key"

[discovery]
kind = "model_list"

[ai]
locality = { kind = "cloud", v = {} }
billing = { kind = "metered" }

[[capability]]
family = "chat_completions"
endpoint = "https://api.openai.com/v1"
kind = "llm"
v = { features = ["chat"], context = 8192, max_output = 4096, wire = "chat_completions" }

# The agent programs that may run on this key (see anthropic.toml).
[[capability]]
family = "acp_agent"
kind = "agent"
v = { program = "codex", key_env = "OPENAI_API_KEY", base_url_env = "OPENAI_BASE_URL", protocols = ["openai_compatible"] }
