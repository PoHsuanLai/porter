# OpenRouter (openrouter.ai): one key that reaches many companies' models. The account is an API
# key the person pastes, like an email password. `discover` checks it with one authenticated call,
# GET /api/v1/key with a bearer token (the models list is public there, so it would accept any
# key), and keeps none of the answer. The row below is the floor every chat model meets; which
# models the key reaches is the curated catalogue's and inferd's routing, and accountd keeps no
# list. The price is a mid-range floor (millionths of a dollar per million tokens) that the
# catalogue's per-model prices replace. The sign-in that mints a key through the browser (PKCE)
# is not built: it would be a second sign-in on this file (FINDINGS).
id = "openrouter"
label = "OpenRouter"
mark = "openrouter"

[auth]
kind = "api_key"

[discovery]
kind = "model_list"

[ai]
locality = { kind = "cloud", v = {} }
billing = { kind = "metered", v = { input_per_mtok = 3000000, output_per_mtok = 15000000 } }

[[capability]]
family = "chat_completions"
endpoint = "https://openrouter.ai/api/v1"
kind = "llm"
v = { features = ["chat"], context = 8192, max_output = 4096, wire = "chat_completions" }
