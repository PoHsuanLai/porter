# llama.cpp's `llama-server` that the person runs themselves on this computer: found by a probe,
# no sign-in; its model is read from /props and /v1/models (design/31 §3.3). inferd reports it
# through `Peer.ReportLocal`; the account goes `offline` when the server stops and is never
# deleted for it. The row below is the floor every chat model meets.
id = "llama-cpp"
label = "llama.cpp"
mark = "llama-cpp"

[mark_face]
letter = "L"
colour = "#8A5A44"

[auth]
kind = "local_runtime"

[discovery]
kind = "probe_ports"
v = { ports = [8080] }

[ai]
locality = { kind = "on_device" }
billing = { kind = "free" }

[[capability]]
family = "chat_completions"
kind = "llm"
v = { features = ["chat"], context = 2048, max_output = 2048, wire = "chat_completions" }
