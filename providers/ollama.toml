# Ollama on this computer: found by a probe, no sign-in; its models are discovered from
# /api/tags and /api/show (design/31 §3.3). The row below is the floor every chat model meets.
id = "ollama"
label = "Ollama"
mark = "ollama"

[auth]
kind = "local_runtime"

[discovery]
kind = "probe_ports"
v = { ports = [11434] }

[ai]
locality = { kind = "on_device" }
billing = { kind = "free" }

[[capability]]
family = "ollama_native"
kind = "llm"
v = { features = ["chat"], context = 2048, max_output = 2048, wire = "ollama_native" }
