# A test that hangs fails instead of holding the gate: nextest names it slow every minute and ends it
# after ten. The bus and supervisor tests take seconds; under a heavily loaded machine the slowest
# take a few minutes, well inside the limit.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

# The standing load check: the same tests with four times as many running at once as the machine
# has CPUs (128 for the 32 CPUs of the development machine; `NEXTEST_TEST_THREADS=<4 x nproc>`
# overrides it on another). The contention comes from the run itself, so it does not depend on what
# else the computer is doing. Run it as the jailed gate runs the archive, with `--profile crowded`.
# A test that passes here and fails only on a busy machine waits for something by a count of
# sleeps, or a daemon that has a short deadline of its own.
[profile.crowded]
test-threads = 128
slow-timeout = { period = "60s", terminate-after = 10 }
