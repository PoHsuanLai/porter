section = "Automatic"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["never", "idle_only"]

[key.labels]
never = "Never"
idle_only = "When idle"

[key.page]
kind = "intelligence"

