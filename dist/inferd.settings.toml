# inferd's settings schema (design/22 section 9.2): every row below is read by inferd at exactly
# this path in $XDG_CONFIG_HOME/quire/inferd.toml (a test walks this file and checks that each row
# changes what inferd does), written by hand until inferd can write its own (`--write-schema`).
# Install to $XDG_DATA_DIRS/quire/settings/inferd.settings.toml.
#
# Not in this file: `ai.model.<slot>.<tier>`, the model picker (slots: text, voice_in, voice_out,
# image_in, computer_use, embeddings; the old kind segments llm, speech_in and speech_out still read). Its choices are the models inferd
# knows now, so inferd describes those rows itself, as the live module org.quire.SettingsModule1 at
# /org/quire/Inference1/settings (callable by the Settings role only).
#
# Every row is hands-off: ai.* is never agent-settable (AGENT_NEVER_SETTABLE), so no row carries
# `agent = "settable"`.
app = "inferd"
file = "quire/inferd.toml"
version = 1
# The tables inferd keeps in its file beside the rows (quire's ForeignTables; v0.2.19's parser
# ignores this line, v0.2.20 reads it).
foreign = ["engines", "probe", "callers"]

[[key]]
path = "ai.local_only"
default = "on"
label = "Keep AI on this computer"
help = "While on, no request goes to a cloud account, whatever a data class allows."
section = "Models"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.labels]
on = "On"
off = "Off"

[key.page]
kind = "intelligence"

[[key]]
path = "ai.attached.my_network"
default = "off"
label = "Count my other machines as this computer"
help = "An AI model you set up on another of your own machines (reached through a tunnel, such as a lab server) keeps your data on your own network, but it is not this computer. While off, data set to stay on this computer is not sent to it. While on, it may receive that data too."
section = "Models"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "on"]

[key.labels]
off = "Off"
on = "On"

[key.page]
kind = "intelligence"

[[key]]
path = "ai.agents.endpoint"
default = "off"
label = "Let coding agents use my AI models"
help = "While on, an external coding agent that your desktop starts may be given a private address on this computer through which it uses an AI account you have granted it, or a model on this computer, with your spend limits and without ever holding the account's key. While off, no such address is opened."
section = "Models"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "on"]

[key.labels]
off = "Off"
on = "On"

[key.page]
kind = "intelligence"

[[key]]
path = "ai.floor.app_own"
default = "anywhere"
label = "The app's own data"
help = "The farthest data of this kind may travel to be answered by a model."
section = "Models"
exposure = "basic"

[key.kind]
kind = "segmented"

[key.kind.v]
variants = ["on_device", "local_network", "anywhere"]

[key.labels]
on_device = "This computer"
local_network = "My machines"
anywhere = "Anywhere"

[key.page]
kind = "intelligence"

