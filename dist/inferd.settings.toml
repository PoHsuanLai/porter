# inferd's settings schema (design/22 section 9.2): every row below is read by inferd at exactly
# this path in $XDG_CONFIG_HOME/quire/inferd.toml (a test walks this file and checks that each row
# changes what inferd does), written by hand until inferd can write its own (`--write-schema`).
# Install to $XDG_DATA_DIRS/quire/settings/inferd.settings.toml.
#
# Not in this file: `ai.model.<kind>.<tier>`, the model picker. Its choices are the models inferd
# knows now, so inferd describes those rows itself, as the live module org.quire.SettingsModule1 at
# /org/quire/Inference1/settings (callable by the Settings role only).
#
# Every row is hands-off: ai.* is never agent-settable (AGENT_NEVER_SETTABLE), so no row carries
# `agent = "settable"`.
app = "inferd"
file = "quire/inferd.toml"
version = 1

[[key]]
path = "ai.local_only"
default = "on"
label = "Keep AI on this computer"
help = "While on, no request goes to a cloud account, whatever a data class allows."
section = "Models"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.labels]
on = "On"
off = "Off"

[key.page]
kind = "intelligence"

[[key]]
path = "ai.floor.app_own"
default = "anywhere"
label = "The app's own data"
help = "The farthest data of this kind may travel to be answered by a model."
section = "Models"
exposure = "basic"

[key.kind]
kind = "segmented"

[key.kind.v]
variants = ["on_device", "local_network", "anywhere"]

[key.labels]
on_device = "This computer"
local_network = "My machines"
anywhere = "Anywhere"

[key.page]
kind = "intelligence"

