# inferd's configuration: $XDG_CONFIG_HOME/quire/inferd.toml. Every table is optional; without the
# file inferd serves nobody (no callers) and runs nothing (no engine programs).

# Where the engine programs are, never found from the environment. A kind with no program is not
# offered: a catalog model whose only engine is vLLM is not available until vllm_python is set.
# hf_cache is the Hugging Face hub directory the weights were downloaded into (by hand for now);
# it defaults to $HF_HOME/hub, else ~/.cache/huggingface/hub.
[engines]
# vllm_python = "/home/you/vllm/.venv/bin/python"
# llama_server = "/usr/bin/llama-server"
# speech_host = "/usr/libexec/quire/speech-host"
# speech_host_libs = "/usr/lib/quire/sherpa"  # the directory of libsherpa-onnx-c-api.so and
#                                             # libonnxruntime.so: the speech host's LD_LIBRARY_PATH,
#                                             # and readable in its sandbox
# kokoro_python = "/home/you/kokoro/.venv/bin/python"
# hf_cache = "/data/hf/hub"
#
# A replay engine plays a cassette instead of running a program (acceptance runs, machines with
# no GPU). It exists only when named here; the file is read from this path and from nowhere else.
# The model is served under the table's name. See crates/inferd/tests/cassettes for the format.
# [engines.scripted]
# replay = "/path/to/cassette.jsonl"
# record = "/path/to/sent.jsonl"  # WRITES EVERY PROMPT THIS ENGINE RECEIVES TO DISK, one JSON line
#                                 # per request, file mode 0600; only on a replay engine, only
#                                 # for acceptance runs. Never enable it in a shipped config.

# An engine you already run, which inferd uses and never starts, stops, evicts or kills: a vLLM on
# a lab machine, reached through an SSH tunnel to a local Unix socket
#   ssh -N -L /run/user/1000/lab-vllm.sock:127.0.0.1:8000 lab
# or on a loopback port. The table's name is the catalog id of the model it serves (the name
# `GET /v1/models` lists is the catalog id: start vLLM with --served-model-name <id>); the
# catalog's codec and tool and reasoning parsers are used, and no account or spend is involved.
#   socket   = "<path>"            a Unix socket the engine speaks HTTP over, or
#   url      = "http://127.0.0.1:<port>"  loopback only; any other host is refused when this file loads
#   key_file = "<path>"            optional: the bearer token (vLLM --api-key), read at each connect,
#                                  never logged; refused unless only you can read it (mode 0600)
#   where    = "this-device" | "my-network"   required, no default: where the data goes.
#              "this-device" is on this computer. "my-network" is another machine of yours: the data
#              leaves this computer, so data set to stay on it is refused unless ai.attached.my_network
#              is on (below).
# No TLS: a socket or a loopback address only, and the tunnel's lifetime is yours. The engine is
# looked at when a session opens (and not otherwise); if it is down or does not list the model the
# session is told it is not ready and the log says why. inferd.service has PrivateNetwork=yes: a
# `url` needs a drop-in like inferd-cloud.conf (the loopback of the host, AF_INET); a `socket` does not.
# [engines.attached."qwen3-32b"]
# socket = "/run/user/1000/lab-vllm.sock"
# key_file = "/home/you/.config/lab/vllm.key"
# where = "my-network"
#
# The settings rows, at the paths the Settings app writes them (the schema is
# dist/inferd.settings.toml; the model rows are served by inferd itself). inferd reads the file again
# a moment after it changes, and on Rescan, so an edit needs no restart; a session already open
# keeps the model it was given. Every row is optional; a value a row does not accept is logged and
# replaced by the row's default, for that row only.
#
# Local-only (on: no request goes to a cloud account) and how far each data class may travel
# (on_device, local_network, anywhere). The defaults: local-only on, and personal classes (mail,
# photos, notes, files, contacts, calendar, screen, clipboard, voice, prompt) on this computer.
# [ai]
# local_only = "on"
# [ai.floor]
# mail = "on_device"
# voice = "on_device"
# prompt = "on_device"
#
# The user's model for a slot and tier: "" (the catalogue's choice), "auto" (inferd picks among
# what is allowed) or "<account>/<model>". Slots: text, voice_in, voice_out, image_in,
# computer_use, embeddings, image_gen, rerank (the old kinds llm, speech_in and speech_out still
# read, as text, voice_in and voice_out); tiers: fast, balanced, best.
# [ai.model.text]
# balanced = "local/holo-3.1-4b"
# fast = "auto"
#
# What Automatic does (ai.auto.*): warm_first is its only mode; allow_evict is "never" or
# "idle_only"; show_reason is "on" or "off".
# [ai.auto]
# mode = "warm_first"
# allow_evict = "idle_only"
# show_reason = "on"
#
# Whether an image the answering model cannot read may be described by the image_in model first
# (ai.pipeline.describe_images): "off" (refuse, with the reason) or "on".
# [ai.pipeline]
# describe_images = "off"
#
# Whether a model on another of your machines (an engine attached with where = "my-network", see
# the engines.attached example above) counts as this computer for data whose floor is "this
# computer" (ai.attached.my_network): "off" (the default: such data is not sent to it) or "on". A floor that
# already says local_network lets it through either way. The data leaves this computer, so the
# default is off.
# [ai.attached]
# my_network = "on"
#
# The share of a spending cap at which a request is warned about, 1 to 1000 (ai.spend.warn_permille),
# and the caps on cloud models, in US cents (0 is no cap): on each account, counting every app that
# uses it, and on each app, whichever account pays; per day and per month, counted in UTC. A cap
# reached refuses the request (spend cap reached). What was spent is kept in
# $XDG_STATE_HOME/quire/inferd/spend.json (money and token counts only).
# [ai.spend]
# warn_permille = 800
# account_daily_cents = 500
# account_monthly_cents = 5000
# app_daily_cents = 200
# app_monthly_cents = 2000
#
# The old shape, still read: a [policy] table (local_only, floors) and [[tiers.rows]] (kind, tier,
# model = { account, model }). The rows above win over it where both say something. It goes when
# FINDINGS "inferd.toml: the old [policy] and [tiers] tables" says.

# An embedding model's vector length, limits and prefixes are the catalog entry's `embed` table
# (stoker catalog file of the model), not this file: memoryd asks for nomic-embed-text v1.5
# (768 numbers, `search_query: ` and `search_document: `).

# Who may call. A caller is the systemd unit behind a bus connection (the bus names its process,
# /proc/<pid>/cgroup names the unit); an app in its own app scope or Flatpak scope is an App
# without a line here. cuad is the only caller that may open a computer-use session.
[callers]
cua = ["cuad.service"]
# The Settings app: the only caller of inferd's settings module (the model picker).
settings = ["org.quire.Settings"]
[callers.apps]
"org.quire.Memory" = ["memoryd.service"]
"org.quire.Intents" = ["intentd.service"]
"org.quire.Companion" = ["companiond.service"]
"org.quire.Reader" = ["readerd.service"]
# voiced holds the microphone and asks for speech to text, which runs on the speech host on this
# computer: the default floor keeps the data class `voice` on_device.
"org.quire.Voice" = ["voiced.service"]

# Structured-output limits (settings ai.structured.*; each row's range is in dist/inferd.settings.toml).
# A value out of range is logged and replaced by the default, for that field only. Read at start.
# [ai.structured]
# open_text = 4096
# open_list = 256
# depth = 16
# repair_budget = 1
