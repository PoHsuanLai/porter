# Opt-in: lets inferd reach hosted models (the cloud accounts the person added and granted).
# Install as $XDG_CONFIG_HOME/systemd/user/inferd.service.d/cloud.conf, then
# `systemctl --user daemon-reload && systemctl --user restart inferd.service`. Without it inferd
# has no network and serves only the models on this computer. Policy still decides per request:
# `ai.local_only`, the per-class floors and the app's grant (design/31 section 5.5); this file
# only lets a request the policy allowed leave the computer.
#
# The engines inferd runs share its sandbox until each has its own (models section 3.9), so with
# this file they can reach the network too.
[Service]
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
