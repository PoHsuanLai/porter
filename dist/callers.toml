# The caller table accountd and syncd read (`[[caller]]` rows of `app`, optional `unit`, `role`).
# Install to /etc/porter/callers.toml; a person's own rows go in
# $XDG_CONFIG_HOME/porter/callers.toml and win over these. A caller is found by its cgroup: an app
# scope (`app-…-<app id>-N.scope`) by its app id, a daemon by the unit named in its row. Roles:
# `settings` (the Settings app), `sheet_host` (draws the accounts sheets), `porter_daemon` (inferd
# and syncd: the Peer methods, ResolveKey), `agent`, `cua`, `agent_launcher`; anything unlisted is an `app`.
# `agent_launcher` (the launcher that runs external coding agents, docket-acp) may call
# `Peer.SetAgentState` and nothing else; it is never granted here. A machine that runs the launcher
# lists it in its own file, $XDG_CONFIG_HOME/porter/callers.toml (or /etc/porter/callers.toml):
#
#   [[caller]]
#   app = "org.quire.DocketAcp"
#   unit = "docket-acp.service"     # or no unit, for a launcher that runs as an app scope
#   role = "agent_launcher"
#   name = "Agents"
# An optional `name = "..."` is what a person reads for the app (Settings' account page says "Sync
# can use Storage", not "org.quire.Sync can use storage"); an app without one is named by its
# desktop entry (`<app id>.desktop`, its `Name=`), else by its id.

# The Settings app (detent).
[[caller]]
app = "org.quire.Settings"
role = "settings"
name = "Settings"

# The shell that draws the accounts sheets.
[[caller]]
app = "org.quire.Shell"
unit = "sill-shell.scope"
role = "sheet_host"
name = "Shell"

# inferd: asks for verdicts and resolves API keys for the models it runs.
[[caller]]
app = "org.quire.Inference"
unit = "inferd.service"
role = "porter_daemon"
name = "Intelligence"

# syncd: lists grants and opens authenticated relays for its replicas.
[[caller]]
app = "org.quire.Sync"
unit = "syncd.service"
role = "porter_daemon"
name = "Sync"
