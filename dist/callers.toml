# The caller table accountd and syncd read (`[[caller]]` rows of `app`, optional `unit`, `role`).
# Install to /etc/porter/callers.toml; a person's own rows go in
# $XDG_CONFIG_HOME/porter/callers.toml and win over these. A caller is found by its process: a
# Flatpak app by its sandbox's own metadata, a native app scope (`app-…-<app id>-N.scope`) by its
# app id, a daemon by the unit named in its row (a service only as the unit's main process, as the
# systemd manager says; a scope, which has none, as any process in it). A row with a unit gives
# its role to that unit alone, never to an app scope of the same id. Roles:
# `settings` (the Settings app), `sheet_host` (draws the accounts sheets), `porter_daemon` (inferd
# and syncd), `agent`, `cua`, `agent_launcher` (inferd's: see below), `terminal` (temor:
# reads the person's computers from `org.quire.Tailnet1` and nothing else), `compositor` (casement:
# lists the desktop-wide Spaces and registers the ids it mints for its workspaces through
# `org.quire.Spaces1.Register`, and nothing else); anything unlisted is an `app`.
# `agent_launcher` (the launcher that runs external coding agents, docket-acp) is inferd's
# business, not accountd's: accountd refuses it outright, and the row that names it lives in
# inferd's own table (dist/inferd.toml).
# An optional `name = "..."` is what a person reads for the app (Settings' account page lists
# "Mail" under an identity, not "org.quire.Mail"); an app without one is named by its desktop
# entry (`<app id>.desktop`, its `Name=`), else by its id.
# A row with a unit that gives a fixed role is honoured only while the systemd manager vouches for
# the unit (peephole's `Full` proof): the process is the unit's main process, the unit comes from
# files root owns (its fragment and every drop-in, in directories only root can write), it is not
# transient, it starts one of the row's programs, and it unsets the loader variables
# (`UnsetEnvironment=` of the 22 names of peephole's LOADER_VARIABLES, as dist/inferd.service
# does). Otherwise the caller is a plain app. A row names its programs with
# `exe = ["/usr/bin/sill", ...]` (absolute paths, one `*` allowed per segment); a row for a daemon
# unit (`inferd.service`) that names none runs `libexec/quire/<name>` under /usr, /usr/local or
# /opt/quire/releases/*. A unit that is not named like a daemon and lists no `exe` is never more
# than a process nobody knows: put its programs in the row.

# The Settings app (detent), as the unit the desktop runs it in: any program may start an app
# scope called `app-org.quire.Settings-N.scope`, so the role is not given by the app's name.
[[caller]]
app = "org.quire.Settings"
unit = "org.quire.Settings.service"
role = "settings"
name = "Settings"
exe = ["/usr/bin/detent", "/usr/local/bin/detent", "/opt/quire/releases/*/bin/detent"]

# The shell that draws the accounts sheets, as the service the desktop session starts it in: only
# that unit's main process.
[[caller]]
app = "org.quire.Shell"
unit = "sill.service"
role = "sheet_host"
name = "Shell"
exe = ["/usr/bin/sill", "/usr/local/bin/sill", "/opt/quire/releases/*/bin/sill"]

# inferd: asks for verdicts and resolves API keys for the models it runs.
[[caller]]
app = "org.quire.Inference"
unit = "inferd.service"
role = "porter_daemon"
name = "Intelligence"

# syncd: lists grants and opens authenticated relays for its replicas.
[[caller]]
app = "org.quire.Sync"
unit = "syncd.service"
role = "porter_daemon"
name = "Sync"

# temor, the terminal: reads the person's computers (`Tailnet1.Machines`) and nothing else.
# temor's unit is `org.quire.Temor.service` (`Type=dbus`, as detent's `org.quire.Settings.service`).
# It is checked against the manager's main process like every unit row, so it matches only the
# service temor runs in, and only with the program temor's unit starts (`ExecStart=/usr/bin/temor`;
# /usr/local for a source install; the release form for when temor joins the desktop's bundle).
[[caller]]
app = "org.quire.Temor"
unit = "org.quire.Temor.service"
role = "terminal"
name = "Terminal"
exe = ["/usr/bin/temor", "/usr/local/bin/temor", "/opt/quire/releases/*/bin/temor"]

# The agents: intentd, the companion and the reader. `agent` is refused more than an app is
# (no keys, no accounts added), but it is also who they are: docket and memoryd answer intentd by
# this row. A person's own file cannot add a row for an app named here (`CallerTable::layered`).
[[caller]]
app = "org.quire.Intents"
unit = "intentd.service"
role = "agent"

[[caller]]
app = "org.quire.Companion"
unit = "companiond.service"
role = "agent"
name = "Assistant"

[[caller]]
app = "org.quire.Reader"
unit = "readerd.service"
role = "agent"

# casement, the compositor: mints a desktop-wide Space id for each workspace and registers it
# (`Spaces1.Register`); it may list the Spaces and nothing else. The row goes live once casement
# runs as its own unit (today desktop-session starts it as a plain child process, which proves no
# role). Until then casement is an `app`, and `Register` refuses it.
#
#   [[caller]]
#   app = "org.quire.Casement"
#   unit = "casement.service"
#   role = "compositor"
#   name = "Desktop"
