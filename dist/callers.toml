# The caller table accountd and syncd read (`[[caller]]` rows of `app`, optional `unit`, `role`).
# Install to /etc/porter/callers.toml; a person's own rows go in
# $XDG_CONFIG_HOME/porter/callers.toml and win over these. A caller is found by its cgroup: an app
# scope (`app-…-<app id>-N.scope`) by its app id, a daemon by the unit named in its row. Roles:
# `settings` (the Settings app), `sheet_host` (draws the accounts sheets), `porter_daemon` (inferd
# and syncd: the Peer methods, ResolveKey), `agent`, `cua`; anything unlisted is an `app`.

# The Settings app (detent).
[[caller]]
app = "org.quire.Settings"
role = "settings"

# The shell that draws the accounts sheets.
[[caller]]
app = "org.quire.Shell"
unit = "sill-shell.scope"
role = "sheet_host"

# inferd: asks for verdicts and resolves API keys for the models it runs.
[[caller]]
app = "org.quire.Inference"
unit = "inferd.service"
role = "porter_daemon"

# syncd: lists grants and opens authenticated relays for its replicas.
[[caller]]
app = "org.quire.Sync"
unit = "syncd.service"
role = "porter_daemon"
