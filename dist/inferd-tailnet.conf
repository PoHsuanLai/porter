# Opt-in: lets inferd lend this computer's models to the person's other computers over their
# Tailscale network, and use the models of those computers. scripts/install.sh puts this file at
# $prefix/share/porter/inferd-tailnet.conf as data; the Settings switch "Let my other computers use
# this computer's models" installs it, with the person's consent, as
# $XDG_CONFIG_HOME/systemd/user/inferd.service.d/tailnet.conf (porter_client::TailnetLending) and
# restarts inferd.service. By hand: copy it there, then
# `systemctl --user daemon-reload && systemctl --user restart inferd.service`. Without it inferd
# reaches this computer's own addresses only and the network's addresses are out of reach: a
# computer that turns "Let my other computers use this computer's models" on finds nobody can
# connect.
#
# Only Tailscale's own addresses are opened (100.64.0.0/10 and fd7a:115c:a1e0::/48), not the
# internet: the engines inferd runs share its sandbox until each has its own (models section
# 3.9), so with this file they could reach the person's other computers too, and nothing else.
# Who may connect, and who inferd connects to, is decided by what Tailscale says about the
# computer, not by this file; see dist/inferd.settings.toml (`ai.tailnet.serve`).
[Service]
IPAddressAllow=100.64.0.0/10 fd7a:115c:a1e0::/48
