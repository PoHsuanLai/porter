# The part of syncd.service that needs a mount namespace, kept apart so one switch turns it off.
# scripts/install.sh installs this file next to the unit when `systemd-run --user -p PrivateTmp=yes
# -p ProtectSystem=strict` works on this computer. Some systems refuse a user service its own mount
# namespace (Ubuntu 24.04 with kernel.apparmor_restrict_unprivileged_userns=1: the unit fails with
# status 226/NAMESPACE); there the unit runs without this file, and without these protections.
[Service]
# The person's files are out of reach except what syncd keeps: the unit's state directories, and
# the porter directory under the data home (the PIM mirrors, the app folder mirrors and the photo
# libraries, which the unit's pre-start step makes). A missing ReadWritePaths entry fails the unit.
ProtectHome=read-only
ProtectSystem=strict
ReadWritePaths=%h/.local/share/porter
PrivateTmp=yes
PrivateDevices=yes
# No kernel, module or debug surfaces, no clock or hostname changes.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
