# The part of syncd.service that needs a mount namespace, kept apart so one switch turns it off.
# scripts/install.sh installs this file next to the unit when `systemd-run --user -p PrivateTmp=yes
# -p ProtectSystem=strict` works on this computer. Some systems refuse a user service its own mount
# namespace (Ubuntu 24.04 with kernel.apparmor_restrict_unprivileged_userns=1: the unit fails with
# status 226/NAMESPACE); there the unit runs without this file, and without these protections.
[Service]
# The person's files are out of reach except what syncd keeps: the unit's state directories, the
# porter directory under the data home (the PIM mirrors, the app folder mirrors and the photo
# libraries), the drives' cache under the cache home, and syncd's own folder under the config home
# (porter/syncd: syncd.toml is replaced by a rename there, so the folder and not only the file;
# porter/ itself, which holds accountd's caller table, is not writable), which the unit's
# pre-start step makes. A missing ReadWritePaths entry fails the unit.
ProtectHome=read-only
ProtectSystem=strict
ReadWritePaths=%h/.local/share/porter %h/.cache/porter %h/.config/porter/syncd
PrivateTmp=yes
# No devices: a drive's folder is served over the connection porter-mountd opens and hands back,
# which needs no /dev/fuse here.
PrivateDevices=yes
# No kernel, module or debug surfaces, no clock or hostname changes.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
