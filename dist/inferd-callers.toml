# inferd's caller table: installed as /etc/porter/inferd-callers.toml, root's to write. inferd
# reads it at start and from nowhere else; a [callers] table in a person's inferd.toml is ignored,
# because these rows give standing (computer use, the settings module, the agent launcher, choosing
# where the assistant runs) that a person's own file must not be able to give a program. A test
# build (test-proc-root) may read another file, named by PORTER_INFERD_CALLERS.
#
# Who may call. A caller is the systemd unit behind a bus connection (the bus names its process,
# /proc/<pid>/cgroup names the unit); an app in its own app scope or Flatpak scope is an App
# without a line here. cuad is the only caller that may open a computer-use session.
cua = ["cuad.service"]
# The Settings app: the only caller of inferd's settings module (the model picker), as the unit the
# desktop runs it in, and only that unit's main process (as accountd's callers.toml). An app name
# here (the old form, "org.quire.Settings") stands for "<app>.service", never for an app scope of
# that name, which any program can start.
settings = ["org.quire.Settings.service"]
# The shell (sill): it may list the places the assistant can run (Inference1.Places) and ask for
# nothing else, as the unit the desktop session starts it in, and only that unit's main process.
shell = ["sill.service"]
# The units that may choose where the assistant runs (the `places` and `place_models` options of
# Open, Prepare and Availability). Each must also be an app under [apps]. Of these the
# companion alone may also list the places, as Settings and the shell may.
places = ["companiond.service", "readerd.service", "intentd.service"]
# The agent launcher (docket-acp): the only caller of org.quire.Inference1.Agents, which opens a
# loopback model endpoint for an external coding agent, and of org.quire.Inference1.Launcher,
# through which it signs agents in and out, asks for an agent's key and is handed the credential
# of a process it starts (it was accountd's caller table that listed it before; accountd no
# longer answers it). Never listed by default: a machine that runs the launcher writes its unit
# here (the row accountd's callers.toml described: the app org.quire.DocketAcp, unit
# docket-acp.service, role agent_launcher, named "Agents"), and turns on ai.agents.endpoint.
# agent_launcher = ["docket-acp.service"]
#
# An entry here or under [apps] is a unit's name, or the unit and the programs that may run in it:
# a daemon's `<name>.service` runs `libexec/quire/<name>` (under /usr, /usr/local or
# /opt/quire/releases/*) without saying so, but a scope or a dotted service names none, and is
# nobody until its entry lists them, e.g.
#   { unit = "docket-acp.scope", exe = ["/usr/bin/docket-acp", "/usr/local/bin/docket-acp",
#     "/opt/quire/releases/*/bin/docket-acp"] }
[apps]
"org.quire.Memory" = ["memoryd.service"]
"org.quire.Intents" = ["intentd.service"]
# The companion: its daemon, and docket-acp, the editor-agent launcher, which runs the planner's
# turns in its own scope. A scope's name gives no program, so the entry names docket-acp's.
"org.quire.Companion" = [
    "companiond.service",
    { unit = "docket-acp.scope", exe = ["/usr/bin/docket-acp", "/usr/local/bin/docket-acp", "/opt/quire/releases/*/bin/docket-acp"] },
]
"org.quire.Reader" = ["readerd.service"]
# voiced holds the microphone and asks for speech to text, which runs on the speech host on this
# computer: the default floor keeps the data class `voice` on_device.
"org.quire.Voice" = ["voiced.service"]
