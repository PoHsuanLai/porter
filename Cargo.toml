[workspace]
resolver = "3"
members = [
  "crates/porter-core",
  "crates/porter-fs",
  "crates/quickxorhash",
  "crates/keyring-chunked",
  "crates/porter-provider",
  "crates/porter-secrets",
  "crates/porter-sync",
  "crates/porter-drive",
  "crates/porter-drive-fuse",
  "crates/porter-mountd",
  "crates/porter-infer",
  "crates/porter-bridge",
  "crates/porter-service",
  "crates/porter-store",
  "crates/porter-dbus",
  "crates/porter-sheets",
  "crates/porter-client",
  "crates/porter-fake",
  "crates/porter-fake-servers",
  "crates/porter-http",
  "crates/porter-proxy",
  "crates/porter-oauth",
  "crates/porter-discover",
  "crates/dav-proto",
  "crates/porter-dav",
  "crates/porter-families",
  "crates/porter-tailscale",
  "crates/porter-tailnet",
  "crates/porter-router",
  "crates/porter-turns",
  "crates/porter-engines",
  "crates/porter-engines-install",
  "crates/porter-daemon",
  "crates/accountd",
  "crates/syncd",
  "crates/inferd",
  "crates/storage-webdav",
  "crates/storage-graph",
  "crates/storage-gdrive",
  "crates/porter-rig",
  "crates/fake-secret-service",
  "crates/syncd-fakes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/porter"
publish = false

[workspace.dependencies]
porter-core     = { path = "crates/porter-core" }
porter-fs        = { path = "crates/porter-fs" }
quickxorhash    = { path = "crates/quickxorhash" }
keyring-chunked = { path = "crates/keyring-chunked" }
porter-provider = { path = "crates/porter-provider" }
porter-secrets  = { path = "crates/porter-secrets" }
porter-sync     = { path = "crates/porter-sync" }
porter-drive    = { path = "crates/porter-drive" }
porter-drive-fuse = { path = "crates/porter-drive-fuse" }
porter-mountd = { path = "crates/porter-mountd" }
porter-infer    = { path = "crates/porter-infer" }
porter-bridge   = { path = "crates/porter-bridge" }
porter-service  = { path = "crates/porter-service" }
porter-store    = { path = "crates/porter-store" }
porter-dbus     = { path = "crates/porter-dbus" }
porter-sheets   = { path = "crates/porter-sheets" }
porter-client   = { path = "crates/porter-client" }
porter-fake     = { path = "crates/porter-fake" }
porter-fake-servers = { path = "crates/porter-fake-servers" }
fake-secret-service = { path = "crates/fake-secret-service" }
syncd-fakes     = { path = "crates/syncd-fakes" }
porter-http     = { path = "crates/porter-http" }
porter-proxy    = { path = "crates/porter-proxy" }
porter-oauth    = { path = "crates/porter-oauth" }
porter-discover = { path = "crates/porter-discover" }
dav-proto       = { path = "crates/dav-proto" }
porter-dav      = { path = "crates/porter-dav" }
porter-families = { path = "crates/porter-families" }
porter-tailscale = { path = "crates/porter-tailscale" }
porter-tailnet  = { path = "crates/porter-tailnet" }
porter-router   = { path = "crates/porter-router" }
porter-turns    = { path = "crates/porter-turns" }
porter-engines  = { path = "crates/porter-engines" }
porter-engines-install = { path = "crates/porter-engines-install" }
# Without the settings-file watch: a daemon that watches asks for `features = ["watch"]`, so
# porter-dbus (and every bus client through it) never pulls a file watcher in.
porter-daemon   = { path = "crates/porter-daemon", default-features = false }
storage-webdav  = { path = "crates/storage-webdav" }
storage-graph   = { path = "crates/storage-graph" }
storage-gdrive  = { path = "crates/storage-gdrive" }

# quire's live settings modules (`org.quire.SettingsModule1`), for accountd only: the one porter -> quire
# edge (ARCHITECTURE section 1). By git at quire's pinned rev (a local checkout overrides it: ARCHITECTURE section 1); `live` is the module, `tokio` drives its zbus.
ds-settings     = { git = "https://github.com/PoHsuanLai/quire.git", rev = "d17e19da64c8845d8eb413784b2d84f177a86767", features = ["live", "tokio"] }

# peephole: which program is calling (a pinned process, the unit manager's word, a root-owned table),
# by git tag, never by path. porter-dbus's `ProcCallers` is built over it. peephole-bus runs on zbus's
# tokio feature here (its default `async-io` stays off, as the zbus line below).
peephole        = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.11" }
peephole-core   = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.11", default-features = false }
peephole-bus    = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.11", default-features = false, features = ["tokio"] }

# stoker's computer-use vocabulary, by git at stoker's pinned rev (quire
# CONSUMING.md section 1; a local checkout overrides it, ARCHITECTURE section 1). stoker has no porter dependency, so there is no cycle.
cua-action      = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
# inferd's other stoker edges (it is the one place porter's types and stoker's meet), by git at
# the same rev. `model-http` carries the hyper client behind its `hyper` feature;
# `vision-prep` the frame resize behind `pixels`; the testing features hold stoker's scripted
# fakes of the supervisor's seams.
model-provider      = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
model-catalog       = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
engine-supervisor   = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
model-http          = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
model-openai-compat = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
speech-provider     = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
# the client of the speech host (the STT engine process): inferd's `SttBackend::SpeechHost`.
speech-host-client  = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
vision-prep         = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
cua-parse           = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
cua-session         = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
cua-vendors         = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
model-extract       = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
model-replay        = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }
# the codec-over-transport `Driver`: inferd's TLS transport to a cloud model is a `model_http::Transport`
# of its own (stoker's hyper client does not speak TLS yet), so it names the driver that takes one.
model-wire          = { git = "https://github.com/PoHsuanLai/stoker", rev = "f30d2808a9f05901a952c1fac6db2c6479a1bfe2" }

# From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim: only the lines porter
# names itself, as mailo does.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
# porter-daemon's settings-file watch (CC0-1.0, already in Cargo.lock at 8.2.0 through quire).
notify = "8"
roxmltree = "0.21"
# The request and response types (MIT OR Apache-2.0, already in Cargo.lock at 1.5.0 through
# hyper): porter-http's `HttpRequest` and `HttpResponse`, and dav-proto's `http` feature.
http = "1"
# The loopback redirect request and porter-proxy's request head (MIT OR Apache-2.0; already in Cargo.lock).
httparse = "1.10"
# porter-http's client, as stoker's model-http takes it.
hyper = "1"
hyper-util = "0.1.21"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }  # shell repos only; they also enable ds-settings/tokio. quire itself builds zbus with its async-io default so app consumers keep their own executor.
toml = "1"
base64 = "0.22"
# The fake servers' TLS and PKCE (quire accounts-pins 21c453eb, pending): rustls on `ring`, no
# default features, as hyper-rustls is pinned.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "1"
# porter-http's TLS: hyper-rustls and the platform's roots (quire accounts-pins, on master).
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "native-tokio", "logging"] }
sha2 = "0.10"
# The RustCrypto hasher traits quickxorhash implements, at the line sha2 and md-5 already bring.
digest = "0.10"
# inferd's agent token (both already in Cargo.lock): random bytes from the system (MIT OR
# Apache-2.0) and a constant-time compare (BSD-3-Clause).
getrandom = "0.4.3"
subtle = "2.6.1"
# porter-engines-install unpacks the pinned engine archives (`tar.gz`) in process instead of
# running the system's `tar` (both MIT OR Apache-2.0). flate2 is already in Cargo.lock through
# png; tar's `xattr` default is off, nothing reads extended attributes.
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
md-5 = "0.10"
# Lower-case hex of a digest or a byte string (MIT OR Apache-2.0; already in Cargo.lock).
hex = "0.4"
# Percent-encoding (RFC 3986) and form pairs, MIT OR Apache-2.0; both are in Cargo.lock through url.
percent-encoding = "2.3"
form_urlencoded = "1.2"
clap = { version = "4", features = ["derive"] }
proptest = "1"
oo7 = "0.6"
# porter-core's `SecretText` and porter-secrets' encode buffer are wiped when dropped (quire's
# pinned line; Apache-2.0 OR MIT).
zeroize = "1"
# porter-secrets `KeyringSecrets` (macOS, Windows); Linux stays on oo7 (accounts D5).
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
# porter-discover: SRV and MX behind the `Dns` seam.
hickory-resolver = "0.26"
# syncd's journal: SQLCipher built from source with a vendored OpenSSL, used unkeyed (quire's pinned line).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

# Dependencies keep no debug info (porter's own crates keep line tables, `.cargo/config.toml`):
# it is most of what a test link carries.
[profile.dev.package."*"]
debug = false

# The crypto crates run optimised in the tests: oo7's file keyring derives its key with 100 000
# rounds of PBKDF2, and the contract test of that store took 1.5 s of it unoptimised. They are
# small, so the build cost is a few seconds, once.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.inout]
opt-level = 3
