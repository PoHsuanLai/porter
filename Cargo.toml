[workspace]
resolver = "3"
members = [
  "crates/porter-core",
  "crates/porter-fs",
  "crates/prov",
  "crates/porter-provider",
  "crates/porter-secrets",
  "crates/porter-sync",
  "crates/porter-infer",
  "crates/porter-bridge",
  "crates/porter-service",
  "crates/porter-dbus",
  "crates/porter-client",
  "crates/porter-fake",
  "crates/porter-fake-servers",
  "crates/porter-http",
  "crates/porter-proxy",
  "crates/porter-oauth",
  "crates/porter-discover",
  "crates/porter-dav",
  "crates/porter-families",
  "crates/porter-tailscale",
  "crates/porter-tailnet",
  "crates/porter-router",
  "crates/porter-turns",
  "crates/porter-daemon",
  "crates/accountd",
  "crates/syncd",
  "crates/inferd",
  "crates/storage-webdav",
  "crates/storage-graph",
  "crates/storage-gdrive",
  "crates/porter-rig",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/porter"
publish = false

[workspace.dependencies]
porter-core     = { path = "crates/porter-core" }
porter-fs        = { path = "crates/porter-fs" }
prov            = { path = "crates/prov" }
porter-provider = { path = "crates/porter-provider" }
porter-secrets  = { path = "crates/porter-secrets" }
porter-sync     = { path = "crates/porter-sync" }
porter-infer    = { path = "crates/porter-infer" }
porter-bridge   = { path = "crates/porter-bridge" }
porter-service  = { path = "crates/porter-service" }
porter-dbus     = { path = "crates/porter-dbus" }
porter-client   = { path = "crates/porter-client" }
porter-fake     = { path = "crates/porter-fake" }
porter-fake-servers = { path = "crates/porter-fake-servers" }
porter-http     = { path = "crates/porter-http" }
porter-proxy    = { path = "crates/porter-proxy" }
porter-oauth    = { path = "crates/porter-oauth" }
porter-discover = { path = "crates/porter-discover" }
porter-dav      = { path = "crates/porter-dav" }
porter-families = { path = "crates/porter-families" }
porter-tailscale = { path = "crates/porter-tailscale" }
porter-tailnet  = { path = "crates/porter-tailnet" }
porter-router   = { path = "crates/porter-router" }
porter-turns    = { path = "crates/porter-turns" }
porter-daemon   = { path = "crates/porter-daemon" }
storage-webdav  = { path = "crates/storage-webdav" }
storage-graph   = { path = "crates/storage-graph" }
storage-gdrive  = { path = "crates/storage-gdrive" }

# quire's live settings modules (`org.quire.SettingsModule1`), for accountd only: the one porter -> quire
# edge (ARCHITECTURE section 1). By git at quire's pinned rev (a local checkout overrides it: ARCHITECTURE section 1); `live` is the module, `tokio` drives its zbus.
ds-settings     = { git = "https://github.com/PoHsuanLai/quire.git", rev = "8ce6d4b1a026247e286336a51c51d66e3ec7124b", features = ["live", "tokio"] }

# stoker's computer-use vocabulary, by git at stoker's pinned rev (quire
# CONSUMING.md section 1; a local checkout overrides it, ARCHITECTURE section 1). stoker has no porter dependency, so there is no cycle.
cua-action      = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
# inferd's other stoker edges (it is the one place porter's types and stoker's meet), by git at
# the same rev. `model-http` carries the hyper client behind its `hyper` feature;
# `vision-prep` the frame resize behind `pixels`; the testing features hold stoker's scripted
# fakes of the supervisor's seams.
model-provider      = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
model-catalog       = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
engine-supervisor   = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
model-http          = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
model-openai-compat = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
speech-provider     = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
# the client of the speech host (the STT engine process): inferd's `SttBackend::SpeechHost`.
speech-host-client  = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
vision-prep         = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
cua-parse           = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
cua-session         = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
cua-vendors         = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
model-extract       = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
model-replay        = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
# the codec-over-transport `Driver`: inferd's TLS transport to a cloud model is a `model_http::Transport`
# of its own (stoker's hyper client does not speak TLS yet), so it names the driver that takes one.
model-wire          = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }

# From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim: only the lines porter
# names itself, as mailo does.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
# porter-daemon's settings-file watch (CC0-1.0, already in Cargo.lock at 8.2.0 through quire).
notify = "8"
roxmltree = "0.21"
# porter-http's client, as stoker's model-http takes it.
hyper = "1"
hyper-util = "0.1.21"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }  # shell repos only; they also enable ds-settings/tokio. quire itself builds zbus with its async-io default so app consumers keep their own executor.
toml = "1"
base64 = "0.22"
# The fake servers' TLS and PKCE (quire accounts-pins 21c453eb, pending): rustls on `ring`, no
# default features, as hyper-rustls is pinned.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "1"
# porter-http's TLS: hyper-rustls and the platform's roots (quire accounts-pins, on master).
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "native-tokio", "logging"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
proptest = "1"
oo7 = "0.6"
# porter-core's `SecretText` and porter-secrets' encode buffer are wiped when dropped (quire's
# pinned line; Apache-2.0 OR MIT).
zeroize = "1"
# porter-secrets `KeyringSecrets` (macOS, Windows); Linux stays on oo7 (accounts D5).
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
# porter-discover: SRV and MX behind the `Dns` seam.
hickory-resolver = "0.26"
# syncd's journal: SQLCipher built from source with a vendored OpenSSL, used unkeyed (quire's pinned line).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
# The per-user agent's address, lock and start (the `socket` carrier of porter-client). The standalone
# repo at the rev mailo pins; quire's block still names the old copy inside mailo (see FINDINGS).
latchkey = { git = "https://github.com/PoHsuanLai/latchkey", rev = "ef0117ada46854702057c79515516da43b271455" }
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

# Dependencies keep no debug info (porter's own crates keep line tables, `.cargo/config.toml`):
# it is most of what a test link carries.
[profile.dev.package."*"]
debug = false

# The crypto crates run optimised in the tests: oo7's file keyring derives its key with 100 000
# rounds of PBKDF2, and the contract test of that store took 1.5 s of it unoptimised. They are
# small, so the build cost is a few seconds, once.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.inout]
opt-level = 3
